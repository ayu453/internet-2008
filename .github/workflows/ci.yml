name: Web build

on:
  push:
    branches:
      - main
      - feat/random-chat-live-matching
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build production app
        run: npm run build
